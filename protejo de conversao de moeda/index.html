<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400..700;1,400..700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <title>Conversor de moedas</title>
</head>

<body>

    <img class="logo" src="./assets/logo.gif" alt="Logo do conversor de moedas">

    <main>

        <label>
            Converter <b>de</b>

            <select class="from-currency-select">

                <option value="real">R$ Real Brasileiro</option>
                <option value="dolar">US$ Dólar Americano</option>
                <option value="euro">€ Euro</option>
                <option value="libra">£ Libra Esterlina</option>
                <option value="bitcoin">₿ Bitcoin</option>
                <option value="ethereum">Ξ Ethereum</option>
                <option value="ouro">🥇 Ouro (grama)</option>
                <option value="prata">🥈 Prata (grama)</option>

            </select>
        </label>


        <label>
            Converter <b>para</b>

            <select class="currency-select">

                <option value="dolar">US$ Dólar Americano</option>
                <option value="euro">€ Euro</option>
                <option value="libra">£ Libra Esterlina</option>
                <option value="real">R$ Real Brasileiro</option>
                <option value="bitcoin">₿ Bitcoin</option>
                <option value="ethereum">Ξ Ethereum</option>
                <option value="ouro">🥇 Ouro (grama)</option>
                <option value="prata">🥈 Prata (grama)</option>

            </select>
        </label>


        <label>
            Valor

            <input class="input-currency" type="number" placeholder="0,00">
        </label>


        <button class="convert-button">
            Converter
        </button>


        <section>

            <div class="currency-box">

                <img class="from-currency-img" src="./assets/real.png" alt="Logo da moeda de origem">

                <p class="currency from-currency-name">
                    Real Brasileiro
                </p>

                <p class="currency-value-to-convert">
                    R$ 0,00
                </p>

            </div>


            <img class="arrow-img" src="./assets/arrow.png" alt="Seta">


            <div class="currency-box">

                <img class="currency-img" src="./assets/dolar.png" alt="Logo da moeda convertida">

                <p class="currency" id="currency-name">
                    Dólar Americano
                </p>

                <p class="currency-value">
                    US$ 0,00
                </p>

            </div>

        </section>

    </main>


    <script src="./scripts.js"></script>

</body>

</html>
